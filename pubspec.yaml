name: orion
description: an open-source user interface for the Odyssey 3d-printing engine.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+SELFCOMPILED

environment:
  sdk: ">=3.2.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  english_words: ^4.0.0
  flutter_svg: ^2.0.9
  glob: ^2.1.2
  go_router: ^16.0.0
  http: ^1.2.1
  image: ^4.1.3
  ini: ^2.1.0
  intl: any
  path: any
  path_provider: ^2.1.0
  permission_handler: ^12.0.1
  provider: ^6.1.2
  qr_flutter: ^4.0.0
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size
  archive: ^4.0.4
  auto_size_text: ^3.0.0
  crypto: ^3.0.2
  phosphor_flutter: ^2.1.0
  about: ^2.1.3
  pubspec_extract: ^2.0.5
  flutter_markdown: ^0.7.6+2
  logging: ^1.2.0
  toastification: ^3.0.2
  async: ^2.11.0
  fading_edge_scrollview: ^4.1.1
  flex_seed_scheme: ^3.4.1
  country_flags: ^3.2.0
  animations: ^2.0.8
  flutter_localizations:
    sdk: flutter
  marquee: ^2.3.0
  json_annotation: ^4.9.0
  fl_chart: ^1.1.1
  google_fonts: ^6.1.0
  flutter_i18n: ^0.37.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  test: ^1.21.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.10
  json_serializable: ^6.8.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/
    - assets/i18n/
    - assets/images/opensource.svg
    - assets/images/ISO_7010_W024.svg
    - assets/images/placeholder.png
    - assets/images/bsod.png
    - assets/images/ora/open_resin_alliance_logo_darkmode.png
    - assets/images/concepts_3d/athena_logo.svg
    - assets/images/concepts_3d/c3d.svg
    - assets/images/concepts_3d/a2_pro_arm.svg
    - assets/images/concepts_3d/a2_standard_arm.svg
    - assets/images/concepts_3d/levelingsystem/a2_pro_arm_solo_leveling_screws.svg
    - assets/images/concepts_3d/levelingsystem/a2_lcd_pro_arm_align_plate.svg
    - assets/images/concepts_3d/levelingsystem/a2_pro_arm_solo_leveling_screws_top.svg
    - assets/images/concepts_3d/levelingsystem/a2_lcd_pro_arm_align_plate_bottom.svg
    - assets/images/concepts_3d/levelingsystem/a2_lcd_ui_top_view.svg
    - assets/images/concepts_3d/levelingsystem/a2_leveling_spacer_ui_top_view.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_arm_long_end.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_arm_long_end_top.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_arm_long_end_top_layer1.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_arm_long_end_top_layer2.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_arm_short_end.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_arm_short_end_top.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_arm_short_end_top_layer1.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_arm_short_end_top_layer2.svg
    - assets/images/concepts_3d/levelingsystem/a2_hex_key_ui_front_view.svg
    - assets/images/concepts_3d/levelingsystem/a2_lcd_ui_top_view_sanitized.svg
    - README.md
    - CHANGELOG.md

  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-VariableFont_wght.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic-VariableFont_wght.ttf
          style: italic
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegible-BoldItalic.ttf
          weight: 700
          style: italic

    # Noto CJK fallback fonts (not checked into the repo due to size).
    # Run `scripts/download_cjk_fonts.sh` to fetch these into assets/fonts/.
    - family: NotoSansCJK
      fonts:
        - asset: assets/fonts/NotoSansSC-VariableFont_wght.ttf
        - asset: assets/fonts/NotoSansJP-VariableFont_wght.ttf
        - asset: assets/fonts/NotoSansKR-VariableFont_wght.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: onts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

flutter_localizations:
  sdk: flutter
