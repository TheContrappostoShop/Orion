name: Build Orion

on:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  repository-projects: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: seanmiddleditch/gha-setup-ninja@master

      # TEMP BYPASS (Flutter 3.41+ breaks flutterpi_tool 0.10.1 override signature).
      # Keep old dynamic resolver here so we can restore it once flutterpi_tool
      # supports newer flutter_tools APIs again.
      # - id: flutterpi_engine
      #   run: echo "latest=$(gh release list -R ardera/flutter-ci --json name,isLatest --jq '.[] |=select(.isLatest) | .[0].name')" >> $GITHUB_OUTPUT
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable" # or: 'beta', 'dev', 'master' (or 'main')
          # flutterpi_tool 0.10.1 is compatible up to Flutter 3.38.x.
          # Newer Flutter SDKs changed PollingDeviceDiscovery API.
          # Previous (dynamic) value:
          # flutter-version: ${{ steps.flutterpi_engine.outputs.latest }}
          flutter-version: "3.38.4"
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: ${{ runner.os }}-apt-libgtk-3-dev-v1

      - name: Install Linux build dependencies
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          sudo apt-get update
          sudo apt-get -o dir::cache::archives="$HOME/.cache/apt-archives" install -y libgtk-3-dev
          sudo chown -R "$USER:$USER" ~/.cache/apt-archives

      # TEMP BYPASS: pin flutterpi_tool until a release supporting Flutter 3.41+
      # is available.
      # Previous:
      # - run: flutter pub global activate flutterpi_tool
      - run: flutter pub global activate flutterpi_tool 0.10.1

      - run: flutter build linux

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(yq '.version' pubspec.yaml)
          # Strip build metadata if it exists
          VERSION=$(echo $VERSION | sed 's/+.*//')
          echo "result=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Version with Commit Hash
        run: |
          VERSION=$(yq '.version' pubspec.yaml)
          COMMIT_HASH=${GITHUB_SHA::7}
          NEW_VERSION=${VERSION/+SELFCOMPILED/+${COMMIT_HASH}}
          yq -i ".version = \"$NEW_VERSION\"" pubspec.yaml
          echo "Updated version to $NEW_VERSION"

      - name: Run pubspec_extract
        run: flutter pub run pubspec_extract

      - name: Build, Copy, and Compress armv7
        run: |
          BUILD_NAME=orion_armv7
          flutterpi_tool build --release
          # Apply custom Flutter engine patch if present
          PATCH_DIR=assets/flutter_engine_patch
          BUILD_DIR=build/flutter-pi/armv7-generic
          ARCH_SO="$PATCH_DIR/libflutter_engine.armv7.so"
          ARCH_ICU="$PATCH_DIR/icudtl.armv7.dat"
          GEN_SO="$PATCH_DIR/libflutter_engine.so"
          GEN_ICU="$PATCH_DIR/icudtl.dat"
          if [ -f "$ARCH_SO" ]; then
            echo "Applying arch-specific libflutter_engine.so (armv7)..."
            cp "$ARCH_SO" "$BUILD_DIR/libflutter_engine.so"
          elif [ -f "$GEN_SO" ]; then
            echo "Applying custom libflutter_engine.so (armv7)..."
            cp "$GEN_SO" "$BUILD_DIR/"
          fi
          if [ -f "$ARCH_ICU" ]; then
            echo "Applying arch-specific icudtl.dat (armv7)..."
            cp "$ARCH_ICU" "$BUILD_DIR/icudtl.dat"
          elif [ -f "$GEN_ICU" ]; then
            echo "Applying custom icudtl.dat (armv7)..."
            cp "$GEN_ICU" "$BUILD_DIR/"
          fi
          mv build/flutter-pi/armv7-generic $BUILD_NAME
          ( cd $BUILD_NAME && tar -czvf $BUILD_NAME.tar.gz * )
          cp $BUILD_NAME/$BUILD_NAME.tar.gz $BUILD_NAME.tar.gz

      - uses: actions/upload-artifact@v4.3.1
        with:
          name: orion_armv7
          path: orion_armv7/*

      - name: Build, Copy, and Compress aarch64
        run: |
          BUILD_NAME=orion_aarch64
          flutterpi_tool build --arch=arm64 --release
          # Apply custom Flutter engine patch if present
          PATCH_DIR=assets/flutter_engine_patch
          BUILD_DIR=build/flutter-pi/aarch64-generic
          ARCH_SO="$PATCH_DIR/libflutter_engine.aarch64.so"
          ARCH_ICU="$PATCH_DIR/icudtl.aarch64.dat"
          GEN_SO="$PATCH_DIR/libflutter_engine.so"
          GEN_ICU="$PATCH_DIR/icudtl.dat"
          if [ -f "$ARCH_SO" ]; then
            echo "Applying arch-specific libflutter_engine.so (aarch64)..."
            cp "$ARCH_SO" "$BUILD_DIR/libflutter_engine.so"
          elif [ -f "$GEN_SO" ]; then
            echo "Applying custom libflutter_engine.so (aarch64)..."
            cp "$GEN_SO" "$BUILD_DIR/"
          fi
          if [ -f "$ARCH_ICU" ]; then
            echo "Applying arch-specific icudtl.dat (aarch64)..."
            cp "$ARCH_ICU" "$BUILD_DIR/icudtl.dat"
          elif [ -f "$GEN_ICU" ]; then
            echo "Applying custom icudtl.dat (aarch64)..."
            cp "$GEN_ICU" "$BUILD_DIR/"
          fi
          mv build/flutter-pi/aarch64-generic $BUILD_NAME
          ( cd $BUILD_NAME && tar -czvf $BUILD_NAME.tar.gz * )
          cp $BUILD_NAME/$BUILD_NAME.tar.gz $BUILD_NAME.tar.gz

      - uses: actions/upload-artifact@v4.3.1
        with:
          name: orion_aarch64
          path: orion_aarch64/*

      - name: Build, Copy, and Compress x64
        run: |
          BUILD_NAME=orion_x64
          flutterpi_tool build --arch=x64 --release
          # Apply custom Flutter engine patch if present
          PATCH_DIR=assets/flutter_engine_patch
          BUILD_DIR=build/flutter-pi/x64-generic
          ARCH_SO="$PATCH_DIR/libflutter_engine.x64.so"
          ARCH_ICU="$PATCH_DIR/icudtl.x64.dat"
          GEN_SO="$PATCH_DIR/libflutter_engine.so"
          GEN_ICU="$PATCH_DIR/icudtl.dat"
          if [ -f "$ARCH_SO" ]; then
            echo "Applying arch-specific libflutter_engine.so (x64)..."
            cp "$ARCH_SO" "$BUILD_DIR/libflutter_engine.so"
          elif [ -f "$GEN_SO" ]; then
            echo "Applying custom libflutter_engine.so (x64)..."
            cp "$GEN_SO" "$BUILD_DIR/"
          fi
          if [ -f "$ARCH_ICU" ]; then
            echo "Applying arch-specific icudtl.dat (x64)..."
            cp "$ARCH_ICU" "$BUILD_DIR/icudtl.dat"
          elif [ -f "$GEN_ICU" ]; then
            echo "Applying custom icudtl.dat (x64)..."
            cp "$GEN_ICU" "$BUILD_DIR/"
          fi
          mv build/flutter-pi/x64-generic $BUILD_NAME
          ( cd $BUILD_NAME && tar -czvf $BUILD_NAME.tar.gz * )
          cp $BUILD_NAME/$BUILD_NAME.tar.gz $BUILD_NAME.tar.gz

      - uses: actions/upload-artifact@v4.3.1
        with:
          name: orion_x64
          path: orion_x64/*

      - uses: ncipollo/release-action@v1.14.0
        if: github.ref == 'refs/heads/main'
        with:
          artifacts: orion*.tar.gz
          tag: v${{ steps.get_version.outputs.result }}
          skipIfReleaseExists: true
          generateReleaseNotes: true
          commit: ${{github.sha}}

      - uses: ncipollo/release-action@v1.14.0
        if: github.ref != 'refs/heads/main'
        with:
          artifacts: orion*.tar.gz
          tag: BRANCH_${{github.ref_name}}
          skipIfReleaseExists: false
          allowUpdates: true
          prerelease: true
          generateReleaseNotes: true
          commit: ${{github.sha}}